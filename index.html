#bar{display:flex;gap:8px;margin-top:8px}
#save{flex:1;padding:11px;border-radius:9px;border:0;background:#1f8f5f;color:#fff;

#clr{padding:11px 14px;border-radius:9px;border:0;background:#2f3646;color:#c8cede;font-size:13px}

.mid{flex:1;min-width:0}

.cn{font-size:15px;font-weight:700;color:#ffd479;margin-bottom:4px;line-height:1.3}
.kw{font-size:11px;color:#8a94a6;margin-bottom:4px;

.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.tg{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.t1{background:#12351f;color:#3ecf8e}.t2{background:#2e2a10;color:#e8c547}

.t5{background:#2a1a35;color:#c084fc}
.price{font-size:17px;font-weight:700;color:#7ee2b8}
.price small{font-size:10px;color:#5d6779;font-weight:400;margin-left:4px}
.buy{margin-top:7px;padding-top:7px;border-top:1px solid #232b3d}
.bl{font-size:11px;color:#8a94a6;margin-bottom:4px}
.bl b{color:#3ecf8e;font-size:12px}
.bl .mx{color:#a8b2c4}
.bin{display:flex;gap:6px;align-items:center}
.bin input{flex:1;min-width:0;padding:8px 9px;font-size:14px;border-radius:7px;
border:1px solid #2f3646;background:#1a1f2b;color:#e8ebf0;outline:none}
.bin input.miss{border-color:#f0554f;color:#f0554f}
.acts{display:flex;gap:6px;margin-top:6px}
.acts button,.acts a{flex:1;text-align:center;padding:7px 4px;border-radius:7px;border:0;
background:#232b3d;color:#c8cede;font-size:12px;text-decoration:none}
#empty{text-align:center;color:#5d6779;padding:50px 20px;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;background:#1f8f5f;color:#fff;
padding:11px 20px;border-radius:9px;font-size:13px;z-index:999;opacity:0;transition:opacity .25s;
max-width:90%;text-align:center}
#big{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;
align-items:center;justify-content:center;padding:12px}
#big.on{display:flex}
#big img{max-width:100%;max-height:100%;border-radius:10px}
</style>

on800x800.jpg&resize=%7B%22width%22%3A606%7D", "w": 608, "vc": "体积小", "fp": "🟡加价做", "price": 21.99, "gm": 0.308, "bmax": 12.51, "bsug": 4.1}, {"g": "29573700", "b": "P6", "t": "Towel, Super Absorbent, Dries Fast, for Camping", "kw": "towel / camping", "cn": "毛巾（户外）", "img": "https://g-images-process.voghion.com/?bucket=voghion&image=productImages%2F339117be2974205fc32183c968bd58fc_voghion800x800.jpg&resize=%7B%22width%22%3A606%7D", "w": 513, "vc": "体积小", "fp": "🟡加价做", "price": 20.99, "gm": 0.33, "bmax": 13.5, "bsug": 5.47}, {"g": "29649531", "b": "P6", "t": "Beach Towel, Sand-Free, Quick-Drying, 80x160", "kw": "beach towel / fleece", "cn": "抓绒沙滩巾", "img": "https://g-images-process.voghion.com/?bucket=voghion&image=productImages%2F46b1ba74b6d85e040f148ce5c0b60271_voghion1500x1500.jpg&resize=%7B%22width%22%3A606%7D", "w": 608, "vc": "体积小", "fp": "🟡加价做", "price": 21.99, "gm": 0.308, "bmax": 12.51, "bsug": 4.1}];
var BUY = {};
try { BUY = JSON.parse(localStorage.getItem('vgbuy') || '{}') || {}; } catch(e){ BUY = {}; }
var F = 'all', Q = '';

function isMiss(v){
  if (v === undefined || v === null || v === '') return false;
  return isNaN(parseFloat(v));
}
function tagClass(t){
  if (!t) return 't4';
  if (t.indexOf('直接') >= 0) return 't1';
  if (t.indexOf('加价') >= 0) return 't2';
  if (t.indexOf('压缩') >= 0) return 't4';
  if (t.indexOf('做不了') >= 0) return 't3';
  return 't4';
}
function vcClass(c){
  if (c === '体积小') return 't1';
  if (c === '体积大') return 't3';
  return 't2';
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }

function match(r){
  if (F === 'filled') { if (!BUY[r.g]) return false; }
  else if (F === '体积小') { if (r.vc !== '体积小') return false; }
  else if (F !== 'all') { if (!r.fp || r.fp !== F) return false; }
  if (Q) {
    var s = (r.t + ' ' + r.kw + ' ' + (r.cn||'') + ' ' + r.g).toLowerCase();
    if (s.indexOf(Q) < 0) return false;
  }
  return true;
}

function card(r){
  var out = '<div class="card">';
  out += r.img
    ? '<img loading="lazy" src="' + esc(r.img) + '" onclick="zoom(this.src)">'
    : '<div class="noimg">无图</div>';
  out += '<div class="mid">';
  out += '<div class="kw">' + esc(r.b) + ' · ' + esc(r.g) + '</div>';
  if (r.cn) out += '<div class="cn">' + esc(r.cn) + '</div>';
  out += '<div class="ttl">' + esc(r.t) + '</div>';
  out += '<div class="tags">';
  if (r.fp) out += '<span class="tg ' + tagClass(r.fp) + '">' + esc(r.fp) + '</span>';
  if (r.vc) out += '<span class="tg ' + vcClass(r.vc) + '">' + esc(r.vc) + '</span>';
  if (r.w) out += '<span class="tg t4">' + r.w + 'g</span>';
  out += '</div>';
  if (r.price) {
    out += '<div class="price">€' + Number(r.price).toFixed(2);
    if (r.gm) out += '<small>毛' + (r.gm * 100).toFixed(0) + '%</small>';
    out += '</div>';
  }
  out += '<div class="buy">';
  out += '<div class="bl">建议 <b>' + (r.bsug > 0 ? '¥' + Number(r.bsug).toFixed(1) : '—') + '</b>'
       + ' <span class="mx">最高 ' + (r.bmax > 0 ? '¥' + Number(r.bmax).toFixed(1) : '做不了') + '</span></div>';
  var v = BUY[r.g] || '';
  out += '<div class="bin"><input type="text" inputmode="decimal" placeholder="进价 或 一个字" value="'
       + esc(v) + '" class="' + (isMiss(v) ? 'miss' : '') + '"'
       + ' oninput="setBuy(\'' + r.g + '\',this.value)">';
  if (isMiss(v)) out += '<span style="color:#f0554f;font-size:11px">✗找不到</span>';
  out += '</div>';
  out += '<div class="acts">'
       + '<button onclick="cp(\'' + esc(r.t).replace(/'/g, "\\'") + '\')">复制标题</button>'
       + '<a href="https://s.1688.com/selloffer/offer_search.htm?keywords='
       + encodeURIComponent(r.kw || r.t) + '" target="_blank" rel="noopener">1688找货</a>'
       + '</div>';
  out += '</div></div></div>';
  return out;
}

function render(){
  var h = '', n = 0;
  for (var i = 0; i < ROWS.length; i++) {
    if (!match(ROWS[i])) continue;
    h += card(ROWS[i]); n++;
  }
  document.getElementById('list').innerHTML = h || '<div id="empty">没有匹配的商品</div>';
  var filled = Object.keys(BUY).length;
  document.getElementById('cnt').textContent = n + ' / ' + ROWS.length
    + (filled ? ' · 已填 ' + filled : '');
}

function setBuy(g, v){
  v = (v === undefined || v === null) ? '' : String(v).trim();
  if (v === '') { delete BUY[g]; } else { BUY[g] = v; }
  try { localStorage.setItem('vgbuy', JSON.stringify(BUY)); } catch(e){}
  render();
}

function cp(t){
  if (navigator.clipboard) { navigator.clipboard.writeText(t); toast('已复制'); }
  else { var i = document.createElement('textarea'); i.value = t; document.body.appendChild(i);
    i.select(); document.execCommand('copy'); document.body.removeChild(i); toast('已复制'); }
}

function zoom(u){ document.getElementById('bigimg').src = u; document.getElementById('big').classList.add('on'); }

function toast(m){
  var e = document.getElementById('toast');
  e.textContent = m; e.style.opacity = '1';
  clearTimeout(e._t); e._t = setTimeout(function(){ e.style.opacity = '0'; }, 3000);
}

document.getElementById('save').onclick = function(){
  try { localStorage.setItem('vgbuy', JSON.stringify(BUY)); } catch(e){}
  var rows = [['商品ID','英文标题','关键词','体积档','计费g','我的建议进价¥','我的最高进价¥','你的真实进价¥','找不到标记','定价€']];
  var n = 0;
  for (var i = 0; i < ROWS.length; i++) {
    var r = ROWS[i], rb = BUY[r.g];
    if (rb === undefined || rb === null || rb === '') continue;
    n++;
    var isNum = !isNaN(parseFloat(rb));
    rows.push([r.g, r.t, r.kw, r.vc, r.w,
      (r.bsug > 0 ? Number(r.bsug).toFixed(2) : ''),
      (r.bmax > 0 ? Number(r.bmax).toFixed(2) : ''),
      isNum ? parseFloat(rb) : '', isNum ? '' : rb,
      r.price ? Number(r.price).toFixed(2) : '']);
  }
  if (!n) { toast('你还没填任何进价'); return; }
  var csv = '\ufeff' + rows.map(function(a){
    return a.map(function(x){ return '"' + String(x).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\r\n');
  var d = new Date();
  var fn = 'Voghion进价_' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0')
    + String(d.getDate()).padStart(2,'0') + '_' + String(d.getHours()).padStart(2,'0')
    + String(d.getMinutes()).padStart(2,'0') + '.csv';
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fn;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast('已保存 ' + n + ' 条\n文件：' + fn);
};

document.getElementById('clr').onclick = function(){
  if (!confirm('确定清空全部已填进价？')) return;
  BUY = {}; try { localStorage.setItem('vgbuy','{}'); } catch(e){}
  render(); toast('已清空');
};

document.getElementById('q').oninput = function(){ Q = this.value.trim().toLowerCase(); render(); };
var tabs = document.querySelectorAll('.tab');
for (var i = 0; i < tabs.length; i++) {
  tabs[i].onclick = function(){
    for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('on');
    this.classList.add('on'); F = this.getAttribute('data-f'); render();
  };
}
render();
</script>
